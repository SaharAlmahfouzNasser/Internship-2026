[project]
name = "oncoassignment"
version = "0.1.0"
description = "Two-agent tumor board built on LangGraph with a streaming FastAPI server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "langgraph>=0.2",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
tb-run = "tumor_board.cli.run:main"
tb-diagram = "tumor_board.cli.diagram:main"
tb-all = "tumor_board.cli.run_all:main"
tb-serve = "tumor_board.cli.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tumor_board"]
py-modules = ["config", "server"]

[tool.uv]
package = true
